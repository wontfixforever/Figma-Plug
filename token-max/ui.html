        <option value="iOS5">iOS5</option>
        <option value="iOS6">iOS6</option>
        <option value="iOS7">iOS7</option>
        <option value="iOS8">iOS8</option> </select>

    <button id="select-all">Select All</button>

    <button id="export-btn">Export JSON</button>
  </div>

  <div class="footer" id="footer-changelog" style="display: none;">
    <label class="toggle-container">
      <input type="checkbox" id="changelog-include-hidden">
      <span>Include Hidden</span>
    </label>
    <label class="toggle-container">
      <input type="checkbox" id="changelog-include-excluded">
      <span>Show Excluded</span>
    </label>
    
    <button id="export-txt-btn">Export .txt</button>
    <button id="export-csv-btn">Export .csv</button>
    <button id="export-json-btn">Export .json</button>
  </div>

  <!-- Tag Picker Modal -->
  <div id="tag-modal" class="tag-modal-overlay" style="display:none;">
    <div class="tag-modal">
      <div class="tag-modal-header">
        <span>Select Export Tag</span>
        <button class="tag-modal-close" onclick="closeTagModal()">&times;</button>
      </div>
      <div class="tag-modal-tags" id="tag-modal-tags"></div>
      <div class="tag-modal-input-row">
        <input type="text" id="tag-new-input" placeholder="New tag..." maxlength="32">
        <button id="tag-add-btn" onclick="addNewTag()">+</button>
      </div>
      <div class="tag-modal-footer">
        <button id="tag-modal-export" onclick="closeTagModal(); performExport(selectedTags);">Export</button>
      </div>
    </div>
  </div>

  <script>
    let collectionsData = [];
    let aliasMap = {};
    let valueDisplayMode = 'alias'; // 'alias' shows the referenced path; 'value' shows the resolved value
    let currentFileName = "Local File";
    let currentChanges = []; 
    
    // NEW: Store uploaded data globally so we can re-run comparison when toggling hidden vars
    let lastUploadedData = null; 
    let lastUploadedFileName = "";

    // NEW: Track child modes
    let childModes = new Set();

    // NEW: Track Parent assignments { "colId|childModeId": "parentModeId" }
    let parentAssignments = {};

    // Collection-level parent-child links { childColId: parentColId } — cleared on col uncheck
    let collectionParents = {};

    // Table expand/collapse state (persist across renders). Collections default collapsed; folders default expanded.
    let expandedCols = new Set();
    let collapsedFolders = new Set();

    // ── Tag system ──
    const DEFAULT_TAGS = ['iTWS', 'aTWS', 'iGT', 'aGT', 'Web', 'nTWS', 'Impact', 'Primitives'];
    let userTags = [];

    // ── Expand / Collapse state ──
    let isExpanded = false;
    let savedSize     = { width: 0, height: 0 };
    let savedPosition = { x: 0, y: 0 };

    // Continuously track size + position while NOT expanded,
    // so clicking expand snapshots the current state to restore on collapse.
    window.addEventListener('resize', () => {
      if (!isExpanded) {
        savedSize     = { width: window.innerWidth, height: window.innerHeight };
        savedPosition = { x: window.screenX, y: window.screenY };
      }
    });
    window.addEventListener('mousemove', () => {
      if (!isExpanded) {
        savedPosition = { x: window.screenX, y: window.screenY };
      }
    });

    // ── Theme toggle ──
    let currentTheme = 'light';

    function applyTheme(theme) {
      currentTheme = theme;
      const isLight = theme === 'light';
      document.body.classList.toggle('light', isLight);
      const sun = document.getElementById('icon-sun');
      const moon = document.getElementById('icon-moon');
      if (sun) sun.style.display = isLight ? 'none' : 'block';
      if (moon) moon.style.display = isLight ? 'block' : 'none';
      // Persist via Figma clientStorage (postMessage to code.js)
      parent.postMessage({ pluginMessage: { type: 'set-theme', theme } }, '*');
    }

    // Request saved theme from code.js on load
    parent.postMessage({ pluginMessage: { type: 'get-theme' } }, '*');
    parent.postMessage({ pluginMessage: { type: 'get-tags' } }, '*');

    document.getElementById('theme-btn').onclick = () => {
      const next = document.body.classList.contains('light') ? 'dark' : 'light';
      applyTheme(next);
    };

    window.onload = () => {
      parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
      ['export-btn', 'export-txt-btn', 'export-csv-btn', 'export-json-btn'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.add('changelog-btn-disabled');
      });

      document.getElementById('expand-btn').onclick = () => {
        if (!isExpanded) {
          // Snapshot size + position right before expanding
          savedSize     = { width: window.innerWidth,  height: window.innerHeight };
          savedPosition = { x: window.screenX,         y: window.screenY };

          // Compute expanded size relative to screen.
          // figma.ui.reposition(x,y) is relative to the Figma app window origin.
          // window.screenX/Y gives the Figma window's screen position, so we
          // subtract it to convert screen-center coords into Figma-relative coords.
          const screenW = window.screen.availWidth;
          const screenH = window.screen.availHeight;
          const w = Math.max(400, Math.round(screenW - 400));
          const h = Math.max(300, Math.round(screenH - 80));
          const targetScreenX = Math.round((screenW - w) / 2);
          const targetScreenY = Math.round((screenH - h) / 2);
          const x = targetScreenX - window.screenX;
          const y = targetScreenY - window.screenY;

          parent.postMessage({ pluginMessage: { type: 'resize', width: w, height: h, x, y } }, '*');
          document.getElementById('icon-maximize').style.display = 'none';
          document.getElementById('icon-minimize').style.display = 'block';
          isExpanded = true;
        } else {
          // Restore the exact size + position from the moment expand was clicked
          parent.postMessage({ pluginMessage: {
            type: 'resize',
            width:  savedSize.width,
            height: savedSize.height,
            x: savedPosition.x,
            y: savedPosition.y
          }}, '*');
          document.getElementById('icon-maximize').style.display = 'block';
          document.getElementById('icon-minimize').style.display = 'none';
          isExpanded = false;
        }
      };
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg.type === 'load-data') {
        collectionsData = msg.collections;
        aliasMap = msg.variableMap;
        currentFileName = msg.fileName;
        render(); 
        document.getElementById('show-hidden-toggle').onchange = () => render();

        // Reset Refresh Button
        const btn = document.getElementById('refresh-btn');
        if(btn) {
            btn.innerText = "↻ Refresh";
            btn.disabled = false;
        }
      }
    };

    // --- REFRESH LOGIC ---
    // --- UPDATED REFRESH BUTTON LISTENER ---
    document.getElementById('refresh-btn').onclick = () => {
      const btn = document.getElementById('refresh-btn');
      const icon = btn.querySelector('svg');
      
      btn.disabled = true;
      if(icon) icon.classList.add('spinning'); // Start animation
      
      // Request refresh from backend
      parent.postMessage({ pluginMessage: { type: 'refresh-variables' } }, '*');
    };

    // --- UPDATED MESSAGE HANDLER (Fixes Table Refresh) ---
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'load-theme') {
        // Toggle is hidden — force the RePath light theme for now.
        applyTheme('light');
        return;
      }

      if (msg.type === 'load-tags') {
        userTags = msg.tags || [];
        return;
      }

      if (msg.type === 'load-data') {
        // 1. Update Global Data
        collectionsData = msg.collections;
        aliasMap = msg.variableMap;
        currentFileName = msg.fileName;
        
        // 2. Re-render Tree
        render(); 
        document.getElementById('show-hidden-toggle').onchange = () => render();

        // 3. FIX: Re-run Comparison if a file is currently loaded
        if (lastUploadedData && lastUploadedFileName) {
            console.log("Refreshed data received. Updating comparison...");
            runComparison(lastUploadedData, lastUploadedFileName);
        }

        // 4. Reset Refresh Button State
        const btn = document.getElementById('refresh-btn');
        if(btn) {
            const icon = btn.querySelector('svg');
            btn.disabled = false;
            if(icon) icon.classList.remove('spinning');
        }

        // 5. Update "Synced" timestamp (RePath-style)
        const syncedTime = document.getElementById('synced-time');
        if (syncedTime) {
            syncedTime.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
      }
    };

    // --- COMPARISON TOGGLE LISTENER ---
    document.getElementById('changelog-include-excluded').onchange = () => {
      if (lastUploadedData && lastUploadedFileName) {
        runComparison(lastUploadedData, lastUploadedFileName);
      }
    };

   // --- TREE & RENDER LOGIC (No Changes) ---
   function buildTree(variables) {
      const root = {};
      variables.forEach(v => {
        const parts = v.name.split('/');
        let current = root;
        parts.forEach((part, index) => {
          if (index === parts.length - 1) {
            current.__vars = current.__vars || [];
            current.__vars.push(v);
          } else {
            current[part] = current[part] || {};
            current = current[part];
          }
        });
      });
      return root;
    }

    // ── RePath-style flat grid table renderer ──
    function escAttr(x){ return String(x).replace(/"/g,'&quot;'); }

    function formatCellValue(val, type, resolvedVal) {
      if (val === undefined || val === null) return '';
      if (val.type === 'VARIABLE_ALIAS') {
        if (type === 'FLOAT') {
          const aliasPath = (aliasMap[val.id] || '').replace(/[{}]/g,'');
          const parts = aliasPath.split('/').filter(Boolean);
          const shortPath = parts.slice(-2).join('/');
          const suffix = (resolvedVal !== undefined && resolvedVal !== null) ? ' (' + resolvedVal + ')' : '';
          return shortPath + suffix;
        }
        return (resolvedVal !== undefined && resolvedVal !== null) ? String(resolvedVal) : '{ }';
      }
      if (type === 'FLOAT') return String(val);
      if (type === 'STRING') return val === '' ? '""' : (val.length > 28 ? val.substring(0,26) + '…' : val);
      if (type === 'BOOLEAN') return val ? 'True' : 'False';
      return String(val);
    }

    function valueCellHtml(v, col, modeIdx) {
      const mode = col.modes[modeIdx];
      const rawValue = v.valuesByMode ? v.valuesByMode[mode.modeId] : undefined;
      const resolved = v.resolvedValuesByMode ? v.resolvedValuesByMode[mode.modeId] : undefined;
      let inner;
      const isAlias = rawValue && rawValue.type === 'VARIABLE_ALIAS';
      if (isAlias && valueDisplayMode === 'alias') {
        // Alias mode: show the referenced path instead of the resolved value.
        const aliasPath = (aliasMap[rawValue.id] || '').replace(/[{}]/g, '');
        if (!aliasPath) {
          inner = '<span class="val-text muted">Unresolved</span>';
        } else {
          let lead;
          if (v.type === 'COLOR' && resolved && typeof resolved === 'object' && 'r' in resolved) {
            const css = 'rgba(' + Math.round(resolved.r*255) + ', ' + Math.round(resolved.g*255) + ', ' + Math.round(resolved.b*255) + ', ' + resolved.a + ')';
            lead = '<span class="swatch"><span style="background:' + css + '"></span></span>';
          } else {
            lead = '<span class="alias-link"><i data-lucide="link-2"></i></span>';
          }
          const aliasParts = aliasPath.split('/').filter(Boolean);
          const shortPath = aliasParts.slice(-2).join('/');
          inner = '<span class="alias" data-fullpath="' + escAttr(aliasPath) + '" onclick="showAliasTooltip(this, event)">' + lead + '<span class="alias-path">' + escAttr(shortPath) + '</span></span>';
        }
      } else if (v.type === 'COLOR') {
        if (resolved && typeof resolved === 'object' && 'r' in resolved) {
          const css = 'rgba(' + Math.round(resolved.r*255) + ', ' + Math.round(resolved.g*255) + ', ' + Math.round(resolved.b*255) + ', ' + resolved.a + ')';
          const hex = rgbToHex(resolved);
          inner = '<span class="swatch"><span style="background:' + css + '"></span></span>'
            + '<span class="val-text val-copy" data-copy="' + hex + '" onclick="copyCellValue(this, event)" title="Click to copy">' + hex + '</span>';
        } else {
          inner = '<span class="val-text muted">—</span>';
        }
      } else {
        // Value mode (or a non-alias): show the resolved value; for an alias, resolve it.
        const valForText = isAlias ? resolved : rawValue;
        const txt = formatCellValue(valForText, v.type, resolved);
        inner = (txt === '') ? '<span class="val-text muted">—</span>' : '<span class="val-text">' + txt + '</span>';
      }
      return '<div class="cell mode-idx-' + modeIdx + '">' + inner + '</div>';
    }

    function typeTagFor(v) {
      const typeLabels = { 'COLOR': 'Color', 'FLOAT': 'Number', 'STRING': 'String', 'BOOLEAN': 'Boolean' };
      const scopeLabels = { 'CORNER_RADIUS':'Radius','WIDTH_HEIGHT':'Size','GAP':'Gap','STROKE_FLOAT':'Stroke','OPACITY':'Opacity','FONT_SIZE':'Font Sz','FONT_WEIGHT':'Weight','LINE_HEIGHT':'Line Ht','LETTER_SPACING':'Tracking','PARAGRAPH_SPACING':'Para Sp','PARAGRAPH_INDENT':'Indent','TEXT_CONTENT':'Text','EFFECT_FLOAT':'Effect' };
      const singleScope = v.type === 'FLOAT' && v.scopes && v.scopes.length === 1 && v.scopes[0] !== 'ALL_SCOPES';
      return singleScope ? (scopeLabels[v.scopes[0]] || v.scopes[0]) : (typeLabels[v.type] || v.type);
    }

    function varRowHtml(v, colId, col, tpl, depth) {
      const pad = 12 + depth * 14;
      const leaf = v.name.split('/').pop();
      let cells = '';
      for (let i = 0; i < col.modes.length; i++) cells += valueCellHtml(v, col, i);
      return '<div class="var-item row' + (v.hidden ? ' is-hidden' : '') + '" data-colid="' + colId + '" data-path="' + escAttr(v.name) + '" style="grid-template-columns:' + tpl + '"'
        + ' onclick="if(event.target.type!==\'checkbox\'){const c=this.querySelector(\'.var-check\');c.checked=!c.checked;c.dispatchEvent(new Event(\'change\'));}">'
        + '<div class="name-cell" style="padding-left:' + pad + 'px">'
        + '<input type="checkbox" class="var-check" data-colid="' + colId + '" data-path="' + escAttr(v.name) + '" value="' + v.id + '">'
        + '<span class="var-name">' + leaf + '</span>'
        + '<span class="var-type" data-vtype="' + v.type + '">' + typeTagFor(v) + '</span>'
        + '</div>' + cells + '</div>';
    }

    function folderRowHtml(name, colId, path, tpl, depth, isCollapsed) {
      const pad = 12 + depth * 14;
      return '<div class="folder-row row' + (isCollapsed ? ' collapsed' : '') + '" data-colid="' + colId + '" data-path="' + escAttr(path) + '" style="grid-template-columns:' + tpl + '" onmouseenter="groupHover(this, true)" onmouseleave="groupHover(this, false)">'
        + '<div class="folder-inner" style="padding-left:' + pad + 'px" onclick="toggleFolder(\'' + colId + '\', this.parentElement.dataset.path); event.stopPropagation();">'
        + '<span class="chevron' + (isCollapsed ? '' : ' open') + '">›</span>'
        + '<input type="checkbox" class="folder-check" onclick="event.stopPropagation(); toggleFolderVars(this);">'
        + '<span>' + name + '</span>'
        + '</div></div>';
    }

    // Emit ALL rows (kept in DOM; collapse hides via display:none so selection/export see them)
    function emitRows(node, colId, col, tpl, depth, parentPath, out) {
      if (node.__vars) {
        node.__vars.forEach(function(v){ out.push(varRowHtml(v, colId, col, tpl, depth)); });
      }
      Object.keys(node).forEach(function(key){
        if (key === '__vars') return;
        const path = parentPath ? parentPath + '/' + key : key;
        const isCollapsed = collapsedFolders.has(colId + '|' + path);
        out.push(folderRowHtml(key, colId, path, tpl, depth, isCollapsed));
        emitRows(node[key], colId, col, tpl, depth + 1, path, out);
      });
    }

    function headCellHtml(col, m, idx, savedModeStates) {
      const saved = savedModeStates.find(function(s){ return s.key === col.id + '-' + idx; });
      const isChecked = saved ? saved.checked : true;
      const modeKey = col.id + '|' + m.modeId;
      const isChild = childModes.has(modeKey);
      const singleMode = col.modes.length === 1;
      let parentDropdown = '';
      if (isChild) {
        const assignedParent = parentAssignments[modeKey] || '';
        const options = col.modes.filter(function(o){ return o.modeId !== m.modeId; }).map(function(o){
          const sel = assignedParent === o.modeId ? 'selected' : '';
          const dn = o.name.length > 8 ? o.name.substring(0,7) + '..' : o.name;
          return '<option value="' + o.modeId + '" ' + sel + '>' + dn + '</option>';
        }).join('');
        parentDropdown = '<select class="parent-select" onchange="setParentMode(\'' + col.id + '\',\'' + m.modeId + '\', this.value); event.stopPropagation();" onclick="event.stopPropagation()"><option value="" disabled ' + (assignedParent === '' ? 'selected' : '') + '>Parent</option>' + options + '</select>';
      }
      const fmt = m.name.length <= 12 ? m.name : m.name.substring(0,10) + '...';
      return '<div class="head-cell mode" title="' + escAttr(m.name) + '">'
        + '<input type="checkbox" class="mode-col-check" data-colid="' + col.id + '" data-modeidx="' + idx + '" ' + (isChecked ? 'checked' : '') + ' onclick="toggleModeColumn(this); event.stopPropagation();">'
        + '<span class="mode-label">' + fmt + '</span>'
        + '<span class="child-toggle ' + (isChild ? 'active' : '') + '" onclick="toggleChildMode(\'' + col.id + '\',\'' + m.modeId + '\'); event.stopPropagation();" title="Toggle Child Mode"' + (singleMode ? ' style="visibility:hidden;pointer-events:none;"' : '') + '><i data-lucide="link-2" style="width:11px;height:11px;"></i></span>'
        + parentDropdown + '</div>';
    }

    function render() {
      const treeContainer = document.getElementById('tree');
      const includeHidden = document.getElementById('show-hidden-toggle').checked;
      const savedVarIds = Array.from(document.querySelectorAll('.var-check:checked')).map(function(c){ return c.value; });
      const savedModeStates = Array.from(document.querySelectorAll('.mode-col-check')).map(function(c){ return { key: c.dataset.colid + '-' + c.dataset.modeidx, checked: c.checked }; });

      hideAliasTooltip();
      treeContainer.innerHTML = '';

      collectionsData.forEach(function(col){
        const filteredVariables = includeHidden ? col.variables : col.variables.filter(function(v){ return !v.hidden; });
        if (filteredVariables.length === 0) return;
        const colTree = buildTree(filteredVariables);
        const tpl = 'var(--name-col) repeat(' + col.modes.length + ', var(--mode-col))';
        const colExpanded = expandedCols.has(col.id);
        const modeHeads = col.modes.map(function(m, idx){ return headCellHtml(col, m, idx, savedModeStates); }).join('');
        const out = [];
        emitRows(colTree, col.id, col, tpl, 0, '', out);

        const colEl = document.createElement('div');
        colEl.className = 'collection' + (colExpanded ? '' : ' collapsed');
        colEl.innerHTML =
          '<div class="vtable">'
          + '<div class="head-row row" style="grid-template-columns:' + tpl + '">'
          + '<div class="name-cell">'
          + '<span class="chevron col-chevron' + (colExpanded ? ' open' : '') + '" onclick="toggleCollection(\'' + col.id + '\'); event.stopPropagation();">›</span>'
          + '<input type="checkbox" class="col-check" data-id="' + col.id + '" onclick="event.stopPropagation(); if(!this.checked) clearCollectionParent(\'' + col.id + '\')">'
          + '<span class="col-name" style="cursor:pointer" onclick="toggleCollection(\'' + col.id + '\'); event.stopPropagation();">' + col.name + '</span>'
          + '<button class="connect-btn ' + (collectionParents[col.id] ? 'linked' : '') + '" data-colid="' + col.id + '" onclick="toggleConnectDropdown(\'' + col.id + '\', event)" title="' + (collectionParents[col.id] ? 'Linked to parent' : 'Link to parent collection') + '"><i data-lucide="link-2" style="width:12px;height:12px;"></i></button>'
          + '<select class="connect-dropdown" id="connect-dd-' + col.id + '" onchange="setCollectionParent(\'' + col.id + '\', this.value, event)" onclick="event.stopPropagation()"></select>'
          + '</div>'
          + modeHeads
          + '</div>'
          + out.join('')
          + '</div>';
        treeContainer.appendChild(colEl);
      });

      // Restore variable selection
      treeContainer.querySelectorAll('.var-check').forEach(function(ck){
        if (savedVarIds.includes(ck.value)) ck.checked = true;
        ck.onchange = function(e){ refreshHighlights(e.target.closest('.var-item')); syncParentCheckboxes(e.target); updateExportButtonState(); };
      });
      // Collection master checkbox
      document.querySelectorAll('.col-check').forEach(function(ck){
        ck.onchange = function(e){
          const id = e.target.dataset.id;
          const isChecked = e.target.checked;
          const container = e.target.closest('.collection');
          container.querySelectorAll('.folder-check').forEach(function(f){ f.checked = isChecked; });
          container.querySelectorAll('.var-check[data-colid="' + id + '"]').forEach(function(v){ v.checked = isChecked; });
          container.querySelectorAll('.var-item').forEach(refreshHighlights);
          updateExportButtonState();
        };
      });

      reconcileAllParents();
      treeContainer.querySelectorAll('.collection').forEach(refreshVisibility);
      treeContainer.querySelectorAll('.var-item').forEach(refreshHighlights);
      updateExportButtonState();
      if (window.lucide && lucide.createIcons) lucide.createIcons();
    }

    // --- UI HELPERS ---
    // Alias path tooltip: click an aliased value to see its full path.
    // Auto-clears after 4s or when the user clicks anywhere else.
    let aliasTooltipEl = null;
    let aliasTooltipTimer = null;
    function hideAliasTooltip() {
      if (aliasTooltipTimer) { clearTimeout(aliasTooltipTimer); aliasTooltipTimer = null; }
      if (aliasTooltipEl) aliasTooltipEl.classList.remove('visible');
    }
    // Shared cell tooltip: used for alias paths (Alias mode) and copy confirmations (Value mode).
    function showCellTooltip(anchor, text) {
      if (!aliasTooltipEl) {
        aliasTooltipEl = document.createElement('div');
        aliasTooltipEl.className = 'alias-tooltip';
        document.body.appendChild(aliasTooltipEl);
        // dismiss when clicking anywhere outside the tooltip (triggers stopPropagation)
        document.addEventListener('click', function(e){
          if (aliasTooltipEl.classList.contains('visible') && !aliasTooltipEl.contains(e.target)) {
            hideAliasTooltip();
          }
        });
      }
      aliasTooltipEl.textContent = text;
      // measure while hidden (visibility:hidden still yields layout dimensions)
      const tw = aliasTooltipEl.offsetWidth, th = aliasTooltipEl.offsetHeight;
      const r = anchor.getBoundingClientRect();
      let top = r.bottom + 6, left = r.left;
      if (left + tw > window.innerWidth - 8) left = window.innerWidth - 8 - tw;
      if (left < 8) left = 8;
      if (top + th > window.innerHeight - 8) top = r.top - th - 6; // flip above if no room below
      aliasTooltipEl.style.top = top + 'px';
      aliasTooltipEl.style.left = left + 'px';
      aliasTooltipEl.classList.add('visible');
      aliasTooltipTimer = setTimeout(hideAliasTooltip, 4000);
    }
    function showAliasTooltip(el, event) {
      if (event) event.stopPropagation();
      const full = el.dataset.fullpath || '';
      if (!full) return;
      // Prefix the file name as the first level of the path.
      const withFile = currentFileName ? (currentFileName + '/' + full) : full;
      showCellTooltip(el, withFile);
    }
    // Value mode: click a hex value to copy it (with #) and flash "Copied".
    function copyCellValue(el, event) {
      if (event) event.stopPropagation();
      const val = el.dataset.copy || el.textContent || '';
      if (!val) return;
      let ok = false;
      try {
        const ta = document.createElement('textarea');
        ta.value = val;
        ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        ok = document.execCommand('copy'); // reliable inside the Figma plugin iframe
        document.body.removeChild(ta);
      } catch (e) { ok = false; }
      showCellTooltip(el, ok ? 'Copied' : 'Copy failed');
    }

    // Alias / Value display toggle
    function setValueMode(mode, btn) {
      if (mode === valueDisplayMode) return;
      valueDisplayMode = mode;
      const toggle = btn.closest('.seg-toggle');
      if (toggle) toggle.dataset.mode = mode; // drives the sliding thumb
      toggle.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.toggle('active', b === btn); });
      render();
    }

    // Type color key — each row shows the type's tag exactly as it renders (selected) in the table.
    const TYPE_LEGEND = [
      { vtype: 'COLOR',   label: 'Color',   desc: 'Color variables — fills, strokes, text.' },
      { vtype: 'FLOAT',   label: 'Number',  desc: 'Numeric variables — radius, spacing, sizes.' },
      { vtype: 'STRING',  label: 'String',  desc: 'Text / string variables.' },
      { vtype: 'BOOLEAN', label: 'Boolean', desc: 'True / false variables.' }
    ];
    let legendEl = null, legendTimer = null;
    function hideTypeLegend() {
      if (legendTimer) { clearTimeout(legendTimer); legendTimer = null; }
      if (legendEl) legendEl.classList.remove('visible');
    }
    function showTypeLegend(anchor, event) {
      if (event) event.stopPropagation();
      if (!legendEl) {
        legendEl = document.createElement('div');
        legendEl.className = 'type-legend';
        legendEl.innerHTML = '<h4>Variable type colors</h4>' + TYPE_LEGEND.map(function(t){
          return '<div class="legend-row"><span class="var-type" data-vtype="' + t.vtype + '">' + t.label + '</span>'
            + '<span class="legend-desc">' + t.desc + '</span></div>';
        }).join('');
        document.body.appendChild(legendEl);
        document.addEventListener('click', function(e){
          if (legendEl.classList.contains('visible') && !legendEl.contains(e.target) && !e.target.closest('.help-btn')) {
            hideTypeLegend();
          }
        });
      }
      // measure while hidden (visibility:hidden still yields layout dimensions)
      const tw = legendEl.offsetWidth, th = legendEl.offsetHeight;
      const r = anchor.getBoundingClientRect();
      let top = r.bottom + 8, left = r.right - tw; // right-align to the ? button
      if (left < 8) left = 8;
      if (top + th > window.innerHeight - 8) top = r.top - th - 8; // flip above if no room
      legendEl.style.top = top + 'px';
      legendEl.style.left = left + 'px';
      legendEl.classList.add('visible');
      legendTimer = setTimeout(hideTypeLegend, 5000);
    }

    function toggleElement(el) { el.classList.toggle('expanded'); }
    function toggleModeColumn(checkbox) { checkbox.closest('.collection').querySelectorAll('.var-item').forEach(refreshHighlights); }

    function collectionElById(colId) {
      const cc = document.querySelector('.col-check[data-id="' + colId + '"]');
      return cc ? cc.closest('.collection') : null;
    }
    function toggleCollection(colId) {
      if (expandedCols.has(colId)) expandedCols.delete(colId); else expandedCols.add(colId);
      const el = collectionElById(colId);
      if (el) { const cx = el.querySelector('.col-chevron'); if (cx) cx.classList.toggle('open', expandedCols.has(colId)); refreshVisibility(el); }
    }
    function toggleFolder(colId, path) {
      const key = colId + '|' + path;
      if (collapsedFolders.has(key)) collapsedFolders.delete(key); else collapsedFolders.add(key);
      const el = collectionElById(colId);
      if (el) refreshVisibility(el);
    }
    // Hovering a folder row highlights it and every descendant row (path-prefix match).
    function groupHover(folderRow, on) {
      const colId = folderRow.dataset.colid;
      const path = folderRow.dataset.path || '';
      const prefix = path + '/';
      const container = folderRow.closest('.collection') || document;
      container.querySelectorAll('.row[data-colid="' + colId + '"]').forEach(function(r){
        const p = r.dataset.path || '';
        if (p === path || p.indexOf(prefix) === 0) r.classList.toggle('group-hover', on);
      });
    }
    function refreshVisibility(collectionEl) {
      const colId = collectionEl.querySelector('.col-check') ? collectionEl.querySelector('.col-check').dataset.id : null;
      const colExpanded = expandedCols.has(colId);
      collectionEl.classList.toggle('collapsed', !colExpanded);
      collectionEl.querySelectorAll('.folder-row, .var-item').forEach(function(row){
        const p = row.dataset.path || '';
        let hidden = !colExpanded;
        if (!hidden) {
          const segs = p.split('/');
          for (let n = 1; n < segs.length; n++) {
            if (collapsedFolders.has(colId + '|' + segs.slice(0, n).join('/'))) { hidden = true; break; }
          }
        }
        row.style.display = hidden ? 'none' : '';
        if (row.classList.contains('folder-row')) row.classList.toggle('collapsed', collapsedFolders.has(colId + '|' + p));
      });
    }

    function reconcileAllParents() {
      document.querySelectorAll('.collection').forEach(function(collection){
        const cc = collection.querySelector('.col-check');
        if (!cc) return;
        const allVars = Array.from(collection.querySelectorAll('.var-check'));
        collection.querySelectorAll('.folder-row').forEach(function(fr){
          const fpath = fr.dataset.path; const fc = fr.querySelector('.folder-check'); if (!fc) return;
          const under = allVars.filter(function(vc){ const p = vc.dataset.path; return p === fpath || p.indexOf(fpath + '/') === 0; });
          fc.checked = under.length > 0 && under.every(function(vc){ return vc.checked; });
        });
        cc.checked = allVars.length > 0 && allVars.every(function(vc){ return vc.checked; });
      });
    }
    function syncParentCheckboxes(el) {
      const collection = el.closest('.collection');
      if (!collection) return;
      const allVars = Array.from(collection.querySelectorAll('.var-check'));
      collection.querySelectorAll('.folder-row').forEach(function(fr){
        const fpath = fr.dataset.path; const fc = fr.querySelector('.folder-check'); if (!fc) return;
        const under = allVars.filter(function(vc){ const p = vc.dataset.path; return p === fpath || p.indexOf(fpath + '/') === 0; });
        fc.checked = under.length > 0 && under.every(function(vc){ return vc.checked; });
      });
      const cc = collection.querySelector('.col-check');
      if (cc) cc.checked = allVars.length > 0 && allVars.every(function(vc){ return vc.checked; });
    }
    function toggleFolderVars(checkbox) {
      const fr = checkbox.closest('.folder-row');
      const colId = fr.dataset.colid; const fpath = fr.dataset.path; const checked = checkbox.checked;
      document.querySelectorAll('.var-check[data-colid="' + colId + '"]').forEach(function(vc){
        const p = vc.dataset.path;
        if (p === fpath || p.indexOf(fpath + '/') === 0) {
          vc.checked = checked;
          const row = vc.closest('.var-item'); if (row) refreshHighlights(row);
        }
      });
      reconcileAllParents();
      updateExportButtonState();
    }
    function rgbToHex(color) {
      const toHex = (v) => { const h = Math.round(v * 255).toString(16); return h.length === 1 ? '0' + h : h; };
      return `#${toHex(color.r)}${toHex(color.g)}${toHex(color.b)}`.toUpperCase();
    }
    function refreshHighlights(varItem) {
      const isVarChecked = varItem.querySelector('.var-check').checked;
      varItem.classList.toggle('selected', isVarChecked);
    }
    function isNodeAllHidden(node) {
      const varsAllHidden = !node.__vars || node.__vars.every(v => v.hidden);
      const subFolders = Object.keys(node).filter(k => k !== '__vars');
      return varsAllHidden && subFolders.every(k => isNodeAllHidden(node[k]));
    }
    function toggleChildMode(colId, modeId) {
        const key = `${colId}|${modeId}`;
        if (childModes.has(key)) {
            childModes.delete(key);
        } else {
            childModes.add(key);
        }
        render(); // Re-render to update visual state
    }
    function setParentMode(colId, childModeId, parentModeId) {
        parentAssignments[`${colId}|${childModeId}`] = parentModeId;
        // No need to re-render strictly, but useful if we add visual validation later
    }

    // --- BUTTON & FILE LOGIC ---
    document.getElementById('select-all').onclick = (e) => {
      const tree = document.getElementById('tree');
      const newState = !Array.from(tree.querySelectorAll('.var-check')).every(c => c.checked);
      tree.querySelectorAll('input[type="checkbox"]:not(.mode-col-check)').forEach(c => c.checked = newState);
      document.querySelectorAll('.var-item').forEach(refreshHighlights);
      e.target.innerText = newState ? "Deselect All" : "Select All";
      updateExportButtonState();
    };

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      
      const exportFooter = document.getElementById('footer-export');
      const changelogFooter = document.getElementById('footer-changelog');
      
      if (tabId === 'export-tab') {
        exportFooter.style.display = 'flex';
        changelogFooter.style.display = 'none';
      } else {
        exportFooter.style.display = 'none';
        changelogFooter.style.display = 'flex';
      }
    }

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    fileInput.onchange = (e) => handleFile(e.target.files[0]);
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); };

    function handleFile(file) {
      if (!file || file.type !== "application/json") return alert("Please upload a .json file");
      const reader = new FileReader();
      reader.onload = (e) => {
        let parsedData = null;
        try {
          parsedData = JSON.parse(e.target.result);
        } catch (err) { 
          return alert("Failed to parse JSON file. It might be corrupted."); 
        }

        try {
          lastUploadedData = parsedData;
          lastUploadedFileName = file.name;
          runComparison(lastUploadedData, lastUploadedFileName);
        } catch (err) {
          console.error(err);
          alert("Error running comparison logic: " + err.message); 
        }
      };
      reader.readAsText(file);
    }

    function runComparison(oldData, fileName) {
      const currentVars = {}; 
      const includeHidden = document.getElementById('changelog-include-hidden').checked;
      const checkbox = document.getElementById('changelog-include-excluded');
      const includeExcluded = checkbox ? checkbox.checked : false; 

      const formatDisplayValue = (val) => {
        const str = String(val);
        if (str.startsWith('{') && str.endsWith('}')) {
          const content = str.slice(1, -1);
          const parts = content.split('/');
          return parts.slice(-2).join(' / '); 
        }
        return str;
      };

      // --- 1. SETUP & METADATA ---
      const modeNameTranslation = {}; 
      const oldKnownModeIds = new Set();
      const oldKnownModeNames = new Set(); 
      const oldKnownCollections = new Set(); 
      const oldExportedCollections = new Set(); 
      const oldExportedModes = new Set(); 
      
      const modeRenames = []; 
      const modeLookup = {}; 
      const currentModeIdMap = {}; 

      // ID Mapping Arrays
      const oldIdToPath = new Map();
      const currentIdToPath = new Map();
      const renameMapByNewPath = new Map(); 
      const renameMapByOldPath = new Map(); 

      collectionsData.forEach(col => {
          col.modes.forEach(m => {
              modeLookup[`${col.name}|${m.name}`] = m.modeId;
              currentModeIdMap[m.modeId] = m.name;
          });
      });

      // Extract $knownCollections — new format: single top-level entry at end of array.
      // Backwards compat: old exports have it on each collection root (handled below).
      const processKnownCollections = (knownCollsData, fallbackColName) => {
          for (const [knownColName, knownModes] of Object.entries(knownCollsData)) {
              oldKnownCollections.add(knownColName);
              for (const [id, oldName] of Object.entries(knownModes)) {
                  oldKnownModeIds.add(id);
                  oldKnownModeNames.add(`${knownColName}|${oldName}`);
                  const currentName = currentModeIdMap[id];
                  if (currentName && currentName !== oldName) {
                      modeNameTranslation[oldName] = currentName;
                      modeRenames.push({
                          name: `🏷️ Mode Renamed: ${oldName} ➜ ${currentName}`,
                          col: fallbackColName || knownColName,
                          changes: [{ mode: '—', oldVal: 'Renamed', newVal: '—' }]
                      });
                  }
              }
          }
      };

      const topLevelKnown = oldData.find(o => o && Object.keys(o)[0] === '$knownCollections');
      if (topLevelKnown) processKnownCollections(topLevelKnown.$knownCollections, null);

      oldData.forEach(colObj => {
          if (!colObj) return;
          const colName = Object.keys(colObj)[0];
          if (colName === '$knownCollections') return; // already handled above
          const collectionRoot = colObj[colName];
          oldExportedCollections.add(colName);

          // Backwards compat: old exports have $knownCollections on each collection root
          if (!topLevelKnown && collectionRoot && collectionRoot.$knownCollections) {
              processKnownCollections(collectionRoot.$knownCollections, colName);
          }
          else if (collectionRoot && collectionRoot.$knownModeNames) {
              for (const [id, oldName] of Object.entries(collectionRoot.$knownModeNames)) {
                  oldKnownModeIds.add(id);
                  oldKnownModeNames.add(`${colName}|${oldName}`);
                  oldKnownCollections.add(colName);
              }
          }
      });

      // --- 2. FLATTEN CURRENT DATA ---
      const varTypeLookup = {};
      collectionsData.forEach(col => {
        col.modes.forEach(mode => {
          col.variables.forEach(v => {
            if (!includeHidden && v.hidden) return;

            // Register Current Path by ID
            currentIdToPath.set(v.id, { col: col.name, path: v.name });
            const isRadius = v.type === 'FLOAT' && v.scopes && v.scopes.length === 1 && v.scopes[0] === 'CORNER_RADIUS';
            varTypeLookup[`${col.name}|${v.name}`] = isRadius ? 'RADIUS' : v.type;

            let val = v.valuesByMode[mode.modeId];
            if (val?.type === 'VARIABLE_ALIAS') val = `{${aliasMap[val.id] || 'unknown'}}`;
            else if (val?.r !== undefined) val = rgbToHex(val);
            currentVars[`${col.name}|${mode.name}|${v.name}`] = val;
          });
        });
      });

      const oldVars = {};
      const oldVariablePaths = new Set(); 

      // --- 3. FLATTEN OLD DATA ---
      oldData.forEach(colObj => {
        if (!colObj) return;
        const colName = Object.keys(colObj)[0];
        const collectionRoot = colObj[colName];
        
        const processNode = (obj, path = "", contextMode = null) => {
             if (!obj || typeof obj !== 'object') return; 
             for (let key in obj) {
                let currentPath = "";
                if (path && key.indexOf('/') > -1 && key.startsWith(path + '/')) currentPath = key;
                else currentPath = path ? `${path}/${key}` : key;

                if (obj[key] && obj[key].$value !== undefined) {
                    let modeName = contextMode || obj[key].$mode || "Unknown Mode";
                    if (modeNameTranslation[modeName]) modeName = modeNameTranslation[modeName];

                    // Register Old Path by ID
                    if (obj[key].$id) {
                        oldIdToPath.set(obj[key].$id, { col: colName, path: currentPath });
                    }

                    const flatKey = `${colName}|${modeName}|${currentPath}`;
                    oldVars[flatKey] = obj[key].$value;
                    oldExportedModes.add(`${colName}|${modeName}`);
                    oldVariablePaths.add(`${colName}|${currentPath}`);

                } else if (typeof obj[key] === 'object' && !key.startsWith('$')) {
                    processNode(obj[key], currentPath, contextMode);
                }
            }
        };

        if (collectionRoot.$index) Object.keys(collectionRoot.$index).forEach(k => processNode(collectionRoot.$index[k]));
        else if (collectionRoot.modes) Object.keys(collectionRoot.modes).forEach(k => processNode(collectionRoot.modes[k], "", k));
      });

      // --- 4. MAP RENAMES ---
      for (const [id, currentData] of currentIdToPath.entries()) {
          const oldData = oldIdToPath.get(id);
          if (oldData && oldData.col === currentData.col && oldData.path !== currentData.path) {
              const colKey = currentData.col;
              renameMapByNewPath.set(`${colKey}|${currentData.path}`, oldData.path);
              renameMapByOldPath.set(`${colKey}|${oldData.path}`, currentData.path);
          }
      }

      // --- 5. CALCULATE DIFFS ---
      const groupedChanges = {};

      for (let key in currentVars) {
        const [colName, modeName, varName] = key.split('|');
        const newVal = currentVars[key];
        
        // Use mapped name if renamed
        const renameKey = `${colName}|${varName}`;
        const isRename = renameMapByNewPath.has(renameKey);
        const oldVarName = isRename ? renameMapByNewPath.get(renameKey) : varName;

        const oldKey = `${colName}|${modeName}|${oldVarName}`;
        const oldVal = oldVars[oldKey];

        let isChange = false;
        let displayOldVal = oldVal;

        if (oldVal !== undefined) {
            if (String(oldVal) !== String(newVal)) isChange = true;
        } else {
            const modeKey = `${colName}|${modeName}`;
            const modeId = modeLookup[modeKey];
            const modeNameKey = `${colName}|${modeName}`;

            const isCollectionExcluded = oldKnownCollections.has(colName) && !oldExportedCollections.has(colName);
            
            if (isCollectionExcluded) {
                displayOldVal = '(Excluded)';
            } 
            else if (!oldExportedCollections.has(colName) && !oldKnownCollections.has(colName)) {
                displayOldVal = '(New)';
            }
            else {
                const isModeKnown = (modeId && oldKnownModeIds.has(modeId)) || oldKnownModeNames.has(modeNameKey);
                const isModeExported = oldExportedModes.has(modeKey);

                if (isModeKnown && !isModeExported) {
                    displayOldVal = '(Excluded)';
                } else {
                    displayOldVal = '(New)';
                }
            }
            isChange = true;
        }

        if (isChange || isRename) {
          const groupKey = `${colName}|${varName}`;
          if (!groupedChanges[groupKey]) {
              groupedChanges[groupKey] = { name: varName, col: colName, varType: varTypeLookup[`${colName}|${varName}`] || '', changes: [] };
              
              if (isRename) {
                  groupedChanges[groupKey].changes.push({ 
                      mode: '🏷️ Renamed', 
                      oldVal: oldVarName, 
                      newVal: varName,
                      isRenameEvent: true
                  });
              }
          }
          if (isChange) {
              groupedChanges[groupKey].changes.push({ mode: modeName, oldVal: displayOldVal, newVal });
          }
        }
      }

      for (let key in oldVars) {
          const [colName, modeName, oldVarName] = key.split('|');
          
          // Skip if this old path maps to a new renamed variable
          const oldRenameKey = `${colName}|${oldVarName}`;
          if (renameMapByOldPath.has(oldRenameKey)) continue;

          if (currentVars[`${colName}|${modeName}|${oldVarName}`] === undefined) {
              const currentModeId = modeLookup[`${colName}|${modeName}`];
              if (currentModeId) {
                  const groupKey = `${colName}|${oldVarName}`;
                  if (!groupedChanges[groupKey]) groupedChanges[groupKey] = { name: oldVarName, col: colName, varType: varTypeLookup[`${colName}|${oldVarName}`] || '', changes: [] };
                  groupedChanges[groupKey].changes.push({ mode: modeName, oldVal: oldVars[key], newVal: '(Removed)' });
              }
          }
      }

      // --- 6. FILTER & OUTPUT ---
      currentChanges = [];
      const newModesDetected = new Set();
      const removedModesDetected = new Set();
      modeRenames.forEach(r => currentChanges.push(r));

      const changesByMode = {}; 
      Object.values(groupedChanges).forEach(group => {
          group.changes.forEach(change => {
              if (change.isRenameEvent) return;
              const statsKey = `${group.col}|${change.mode}`;
              if (!changesByMode[statsKey]) changesByMode[statsKey] = { total: 0, isNew: 0, isRemoved: 0 };
              changesByMode[statsKey].total++;
              if (change.oldVal === '(New)') changesByMode[statsKey].isNew++;
              if (change.newVal === '(Removed)') changesByMode[statsKey].isRemoved++;
          });
      });

      Object.values(groupedChanges).forEach(group => {
          const filteredChanges = group.changes.filter(change => {
              if (change.isRenameEvent) return true;
              if (!includeExcluded && change.oldVal === '(Excluded)') return false;

              const statsKey = `${group.col}|${change.mode}`;
              const stats = changesByMode[statsKey];

              const isEntirelyNewMode = stats && stats.isNew === stats.total 
                                     && stats.total > 0 
                                     && !oldExportedModes.has(statsKey)
                                     && !oldKnownModeNames.has(statsKey); 
              
              if (isEntirelyNewMode) {
                  if (!newModesDetected.has(statsKey)) {
                      currentChanges.push({
                          name: `✨ New Mode Added: ${change.mode}`,
                          col: group.col,
                          changes: [{ mode: change.mode, oldVal: '-', newVal: 'Created' }]
                      });
                      newModesDetected.add(statsKey);
                  }
                  return true; 
              }

              const isEntirelyRemovedMode = stats && stats.isRemoved === stats.total && stats.total > 0;
              
              if (isEntirelyRemovedMode) {
                  if (!removedModesDetected.has(statsKey)) {
                      currentChanges.push({
                          name: `🗑️ Mode Removed: ${change.mode}`,
                          col: group.col,
                          changes: [{ mode: change.mode, oldVal: 'Existed', newVal: 'Deleted' }]
                      });
                      removedModesDetected.add(statsKey);
                  }
                  return false; 
              }

              return true;
          });

          if (filteredChanges.length > 0) {
              currentChanges.push({ ...group, changes: filteredChanges });
          }
      });

      // --- 7. RENDER ---
      let tableHtml = `<table class="diff-table"><thead><tr><th class="col-check-th"><input type="checkbox" id="changelog-header-check" checked title="Select/Deselect All"></th><th style="width:30%">Variable / Event</th><th style="width:70%">Changes</th></tr></thead><tbody>`;
      let totalChangeCount = 0;
      
      currentChanges.forEach(group => {
        totalChangeCount += group.changes.length;
        const modesHtml = group.changes.map(c => {
            let newValClass = "val-new";
            let oldValClass = "val-old";
            let displayNewVal = c.isRenameEvent ? c.newVal : formatDisplayValue(c.newVal);
            let displayOldVal = c.isRenameEvent ? c.oldVal : formatDisplayValue(c.oldVal);
            
            if (c.newVal === '(Removed)') newValClass = "val-removed";
            if (c.isRenameEvent) {
                newValClass = "val-new";
                oldValClass = "val-removed";
            }

            return `
              <div class="mode-change-item">
                <span style="font-weight:600; color:#C8D2E4;">${c.mode}</span>
                <span class="val-pill ${oldValClass}" title="${c.oldVal}" style="${c.oldVal === '(Excluded)' ? 'color:#999; background:#eee;' : ''}">${displayOldVal}</span>
                <span class="arrow-icon">➜</span>
                <span class="val-pill ${newValClass}" title="${c.newVal}">${displayNewVal}</span>
              </div>`;
        }).join('');
        
        let nameStyle = "font-weight:600; font-size: 12px;";
        if (group.name.includes("Mode Renamed")) nameStyle += " color: #E67E22;";
        if (group.name.includes("New Mode")) nameStyle += " color: #ADD3E2;";
        if (group.name.includes("Mode Removed")) nameStyle += " color: #D32F2F;";

        const displayName = group.name.includes('/') ? group.name.split('/').pop().trim() : group.name;
        const rowType = group.varType || '';
        tableHtml += `<tr class="diff-row" data-var-type="${rowType}"><td class="col-check-td"><input type="checkbox" class="change-check" checked></td><td style="vertical-align: top; padding-top: 12px;"><div style="${nameStyle}" title="${group.name}">${displayName}</div><div style="color:#999; font-size:10px; margin-top:4px;">${group.col}</div></td><td><div class="mode-change-list">${modesHtml}</div></td></tr>`;
      });
      tableHtml += `</tbody></table>`;
      
      const typeFilterHtml = `<select id="changelog-type-select" style="height:28px; border-radius:6px; border:1px solid var(--border-medium); font-size:11px; padding:0 8px; cursor:pointer; background:var(--bg-surface); color:var(--text-primary); font-weight:500; outline:none;" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border-medium)'"><option value="All">All</option><option value="COLOR">Color</option><option value="RADIUS">Radius</option></select>`;
      document.getElementById('diff-results').innerHTML = totalChangeCount > 0
        ? `<div style="display:flex; align-items:center; justify-content:space-between;"><h4 style="color:var(--text-primary); margin:0;">Found changes in <em>${fileName}</em></h4>${typeFilterHtml}</div>` + tableHtml
        : `<h4 style="color:var(--text-primary);">No changes detected.</h4>`;

      // Wire up type filter
      const typeSelect = document.getElementById('changelog-type-select');
      if (typeSelect) {
        typeSelect.onchange = () => {
          const val = typeSelect.value;
          document.querySelectorAll('#diff-results .diff-row').forEach(row => {
            if (val === 'All' || !row.dataset.varType || row.dataset.varType === val) {
              row.style.display = '';
            } else {

    function triggerDownload(content, filename, type) {

      a.href = url;
      a.download = filename;

    // iOS5 helper: normalize mode name for bucket keys (Light/Dark)
    function ios5BucketName(modeName) {
        if (modeName.includes('Light')) return 'Light';
        if (modeName.includes('Dark')) return 'Dark';
        return modeName;
    }

    function extractUniqueSuffix(parentName, childName) {
      const parentWords = new Set(parentName.split(/\s+/));
      return childName.split(/\s+/).filter(w => !parentWords.has(w)).join('');
    }

    function isIdenticalToParent(childVar, parentVar, childCol, parentCol) {
      let sharedModes = 0;
      for (const childMode of childCol.modes) {
        const normalizedChild = ios5BucketName(childMode.name);
        const parentMode = parentCol.modes.find(m => ios5BucketName(m.name) === normalizedChild);
        if (!parentMode) continue;
        sharedModes++;
        const childVal = String(childVar.valuesByMode[childMode.modeId] && childVar.valuesByMode[childMode.modeId].type === 'VARIABLE_ALIAS'
          ? childVar.valuesByMode[childMode.modeId].id
          : childVar.valuesByMode[childMode.modeId]);
        const parentVal = String(parentVar.valuesByMode[parentMode.modeId] && parentVar.valuesByMode[parentMode.modeId].type === 'VARIABLE_ALIAS'
          ? parentVar.valuesByMode[parentMode.modeId].id
          : parentVar.valuesByMode[parentMode.modeId]);
        if (childVal !== parentVal) return false;
      }
      return sharedModes > 0;
    }

    function formatJson(selectedIds, metaData, preset = "Default") {
      const exposeUnderlying = document.getElementById('expose-underlying-toggle').checked;
      const primitivesMode = document.getElementById('primitives-toggle').checked;

      const getExportValue = (val) => {
        if (!val) return null;
        if (val.type === 'VARIABLE_ALIAS') return `{${aliasMap[val.id] || 'unknown'}}`;
        if (typeof val === 'object' && val.r !== undefined) return rgbToHex(val);
        return val;
      };

      // iOS6: shorten alias paths to last 2 segments — {Primitive Colors/RATIO/Neutral/0} → {Neutral/0}
      const shortenAlias = (val, keepSegments = 2, commonPrefix = '') => {
        if (typeof val !== 'string') return val;
        if (!val.startsWith('{') || !val.endsWith('}')) return val;
        const inner = val.slice(1, -1);
        const parts = inner.split('/');
        if (parts.length <= 2) return val;
        // iOS8 path: strip collection name (first segment) + common prefix segments
        if (commonPrefix) {
          const prefixParts = commonPrefix.split('/').filter(Boolean);
          const afterCol = parts.slice(1);
          let allMatch = afterCol.length > prefixParts.length;
          for (let i = 0; i < prefixParts.length && allMatch; i++) {
            if (afterCol[i] !== prefixParts[i]) allMatch = false;
          }
          const stripped = allMatch ? afterCol.slice(prefixParts.length) : afterCol;
          return `{${stripped.join('/')}}`;
        }
        const take = Math.min(keepSegments, parts.length - 1);
        return `{${parts.slice(-take).join('/')}}`;
      };

      const globalKnowledge = {};
      collectionsData.forEach(c => {
          const modes = {};
          c.modes.forEach(m => modes[m.modeId] = m.name);
          globalKnowledge[c.name] = modes; 
      });

      // Build active collection parent-child pairs for this export
      const exportingColIds = new Set(
        collectionsData.filter(c => c.variables.some(v => selectedIds.includes(v.id))).map(c => c.id)
      );
      const activeChildPairs = {};
      for (const [childId, parentId] of Object.entries(collectionParents)) {
        if (exportingColIds.has(childId) && exportingColIds.has(parentId)) {
          const parentCol = collectionsData.find(c => c.id === parentId);
          const childCol  = collectionsData.find(c => c.id === childId);
          activeChildPairs[childId] = {
            parentCol,
            uniqueSuffix: extractUniqueSuffix(parentCol.name, childCol.name)
          };
        }
      }

      const results = [];

      for (const col of collectionsData) {
        const colResult = { 
            [col.name]: { 
                $version: metaData
            } 
        };

        if (preset !== 'iOS2' && preset !== 'iOS3' && preset !== 'iOS4' && preset !== 'iOS5' && preset !== 'iOS6' && preset !== 'iOS7' && preset !== 'iOS8') {
            if (!primitivesMode) colResult[col.name].modes = {};
        } else if (preset === 'iOS3' || preset === 'iOS4' || preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') {
            colResult[col.name].$index = {};
        }

        let hasSelected = false;

        // Primitives mode: compute the longest common folder prefix across selected variables
        let primitivesStripDepth = 0;
        if (primitivesMode) {
            const selectedVars = col.variables.filter(v => selectedIds.includes(v.id));
            if (selectedVars.length > 0) {
                const allParts = selectedVars.map(v => v.name.split('/').slice(0, -1));
                if (allParts.length > 0 && allParts[0].length > 0) {
                    let depth = 0;
                    for (let i = 0; i < allParts[0].length; i++) {
                        const seg = allParts[0][i];
                        if (allParts.every(p => p[i] === seg)) depth = i + 1;
                        else break;
                    }
                    primitivesStripDepth = depth;
                }
            }
        }

        // iOS8: compute longest common segment-prefix across this child collection's
        // alias values (after collection-name strip). Used to drop redundant brand
        // prefixes like "RATIO/" while keeping meaningful subfolders like "Accessibility/".
        let ios8AliasPrefix = '';
        if (preset === 'iOS8' && activeChildPairs[col.id]) {
            const aliasPaths = [];
            col.variables.forEach(v => {
                if (!selectedIds.includes(v.id)) return;
                col.modes.forEach((mode, mIdx) => {
                    const mhCheck = document.querySelector(`.mode-col-check[data-colid="${col.id}"][data-modeidx="${mIdx}"]`);
                    if (mhCheck && !mhCheck.checked) return;
                    const finalVal = getExportValue(v.valuesByMode[mode.modeId]);
                    if (typeof finalVal === 'string' && finalVal.startsWith('{') && finalVal.endsWith('}')) {
                        const parts = finalVal.slice(1, -1).split('/').slice(1);
                        if (parts.length > 1) aliasPaths.push(parts);
                    }
                });
            });
            if (aliasPaths.length > 0) {
                const minLen = Math.min(...aliasPaths.map(p => p.length));
                let depth = 0;
                for (let i = 0; i < minLen - 2; i++) {
                    const seg = aliasPaths[0][i];
                    if (aliasPaths.every(p => p[i] === seg)) depth = i + 1;
                    else break;
                }
                ios8AliasPrefix = aliasPaths[0].slice(0, depth).join('/');
            }
        }

        col.modes.forEach((mode, idx) => {
          const headerCheck = document.querySelector(`.mode-col-check[data-colid="${col.id}"][data-modeidx="${idx}"]`);
          if (headerCheck && !headerCheck.checked) return;
          
          const modeKey = `${col.id}|${mode.modeId}`;
          const isChild = childModes.has(modeKey);
          let parentId = null;
          let allFamilyIds = []; 

          if (isChild) {
             parentId = parentAssignments[modeKey];
          } else {
             const children = Object.keys(parentAssignments).filter(k => parentAssignments[k] === mode.modeId);
             if (children.length > 0) parentId = mode.modeId; 
          }

          if (parentId) {
             allFamilyIds.push(parentId);
             Object.keys(parentAssignments).forEach(k => {
                 if (parentAssignments[k] === parentId) allFamilyIds.push(k.split('|')[1]);
             });
          }

          // --- iOS3 DOMINANT COLORS ---
          const dominantColors = { Fall: "", Buy: "", Yes: "" };
          if (preset === 'iOS3' || preset === 'iOS4' || preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') {
              col.variables.forEach(v => {
                  if (!selectedIds.includes(v.id)) return;
                  
                  const baseName = v.name.split('/').pop().trim();
                  if (baseName.startsWith("On ")) return;

                  const rawVal = v.valuesByMode[mode.modeId];
                  const finalVal = getExportValue(rawVal);
                  let colorName = "";
                  
                  if (finalVal && finalVal.includes('/')) {
                      const valParts = finalVal.replace(/[{}]/g, '').split('/');
                      colorName = valParts.length >= 2 ? valParts[valParts.length - 2] : valParts[0];
                  }
                  
                  if (v.name.includes("Negative")) dominantColors.Fall = colorName;
                  if (v.name.includes("Buy")) dominantColors.Buy = colorName;
                  if (v.name.includes("Yes")) dominantColors.Yes = colorName;
              });
          }

          const modeData = {};
          
          col.variables.forEach(v => {
             if (selectedIds.includes(v.id)) {
                // All presets: skip child vars that are identical to their linked parent collection.
                // EXCEPT "On *" foreground tokens (On Buy, On Buy Inverse, On Sell, On Sell Inverse, …):
                // the downstream consumer requires the full token set per bucket even when the
                // accessibility value equals the base color, so keep them regardless of identity.
                if (activeChildPairs[col.id]) {
                  const onLeafName = v.name.split('/').pop().trim();
                  const isOnToken = onLeafName.startsWith('On ');
                  const { parentCol } = activeChildPairs[col.id];
                  const parentVar = parentCol.variables.find(pv => pv.name === v.name);
                  if (!isOnToken && parentVar && isIdenticalToParent(v, parentVar, col, parentCol)) return;
                }

                const rawValue = v.valuesByMode[mode.modeId];
                const finalValue = getExportValue(rawValue);

                if (preset === "Default" && isChild && parentId) {
                    const parentRaw = v.valuesByMode[parentId];
                    if (String(finalValue) === String(getExportValue(parentRaw))) return; 
                }

                let iosIndex = null;
                const activePreset = ["iOS", "iOS2", "iOS3", "iOS4", "iOS5", "iOS6", "iOS7", "iOS8"].includes(preset);
                
                if (activePreset && parentId && allFamilyIds.length > 0) {
                    const parentValStr = String(getExportValue(v.valuesByMode[parentId]));
                    const allMatch = allFamilyIds.every(id => String(getExportValue(v.valuesByMode[id])) === parentValStr);
                    let safeModeName = mode.name.split(' ')[0]; // e.g. "Light"
                    let safeParentName = (collectionsData.find(c=>c.id===col.id).modes.find(m=>m.modeId===parentId).name).split(' ')[0]; // e.g. "Light"
                    if (preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') {
                        safeModeName = ios5BucketName(mode.name);
                        safeParentName = ios5BucketName(collectionsData.find(c=>c.id===col.id).modes.find(m=>m.modeId===parentId).name);
                    }

                    // iOS5: keyword family membership trumps allMatch — entire families
                    // (Buy, Sell, Positive, Negative incl. "On" tokens) stay together.
                    const keywords = ["Positive", "Negative", "Buy", "Sell", "Yes", "No"];
                    const hasKeyword = keywords.some(kw => v.name.includes(kw));

                    if ((preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') && hasKeyword) {
                        let colorName = "";
                        if (finalValue && finalValue.includes('/')) {
                            const valParts = finalValue.replace(/[{}]/g, '').split('/');
                            colorName = valParts.length >= 2 ? valParts[valParts.length - 2] : valParts[0];
                        }
                        let prefix = "RiseFall";
                        let groupName = "Fall";
                        if (v.name.includes("Positive") || v.name.includes("Negative")) {
                            if (dominantColors.Fall) colorName = dominantColors.Fall;
                        } else if (v.name.includes("Buy") || v.name.includes("Sell")) {
                            prefix = "BuySell";
                            groupName = "Buy";
                            if (dominantColors.Buy) colorName = dominantColors.Buy;
                        } else if (v.name.includes("Yes") || v.name.includes("No")) {
                            // Both Yes and No share the same set within YesNo/, mirroring
                            // how Buy/Sell share BuySell/Buy* — downstream consumer requires
                            // same-shape token list per folder
                            prefix = "YesNo";
                            groupName = "Yes";
                            if (dominantColors.Yes) colorName = dominantColors.Yes;
                        }
                        iosIndex = `${prefix}/${groupName}${colorName}/${safeModeName}`;
                    } else if (allMatch) {
                        iosIndex = `Common/${safeParentName}`;
                    } else {
                        let colorName = "";
                        if (finalValue && finalValue.includes('/')) {
                            const valParts = finalValue.replace(/[{}]/g, '').split('/');
                            colorName = valParts.length >= 2 ? valParts[valParts.length - 2] : valParts[0];
                        }

                        let groupName = "";
                        let prefix = "RiseFall";

                        if (preset === 'iOS3' || preset === 'iOS4' || preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') {
                            if (v.name.includes("Positive") || v.name.includes("Negative")) {
                                prefix = "RiseFall";
                                groupName = "Fall";
                                if (dominantColors.Fall) colorName = dominantColors.Fall;
                            } else if (v.name.includes("Buy") || v.name.includes("Sell")) {
                                prefix = "BuySell";
                                groupName = "Buy";
                                if (dominantColors.Buy) colorName = dominantColors.Buy;
                            } else if (v.name.includes("Yes") || v.name.includes("No")) {
                                prefix = "YesNo";
                                groupName = "Yes";
                                if (dominantColors.Yes) colorName = dominantColors.Yes;
                            }

                            // If it has a keyword, route it to the specific bucket
                            if (hasKeyword) {
                                iosIndex = `${prefix}/${groupName}${colorName}/${safeModeName}`;
                            } else {
                                // FIX: If it doesn't have a keyword but failed the allMatch check (like Surface),
                                // it's just a Common variable with an override. Leave it in Common.
                                iosIndex = `Common/${safeParentName}`;
                            }

                        } else {
                            for (const kw of keywords) { if (v.name.includes(kw)) { groupName = kw; break; } }
                            if (groupName) {
                                if (preset === 'iOS2') {
                                    if (groupName === 'Sell') { groupName = 'Buy'; colorName = 'Blue'; }
                                    else if (groupName === 'Positive') { groupName = 'Negative'; colorName = 'Red'; }
                                    if (groupName === 'Buy') prefix = 'BuySell';
                                }
                                iosIndex = `${prefix}/${groupName}${colorName}/${safeModeName}`;
                            } else {
                                iosIndex = `Common/${safeParentName}`; // FIX for iOS/iOS2 fallback
                            }
                        }
                    }
                    
                    // Deduplication logic: If a child mode's value is the exact same as the parent's value,
                    // AND it belongs in Common, skip exporting it to prevent duplicates in the JSON.
                    if (isChild) {
                        if (preset === 'iOS3' || preset === 'iOS4' || preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') {
                            if (String(finalValue) === parentValStr && iosIndex && iosIndex.startsWith("Common/")) return;
                        }
                        else {
                            if (iosIndex && iosIndex.startsWith("Common/")) return;
                        }
                    }
                }

                // --- iOS4/iOS5 FALLBACK: name-based bucketing when no parent/child configured ---
                if ((preset === 'iOS4' || preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') && !iosIndex) {
                    const safeModeName = (preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') ? ios5BucketName(mode.name) : mode.name;
                    const leafName = v.name.split('/').pop().trim();
                    // iOS4: Plain "On *" tokens (On Buy, On Negative, etc.) route to Common.
                    // iOS5: All keyword tokens route to their keyword bucket regardless of "On " prefix.
                    const isPlainOnToken = preset !== 'iOS5' && preset !== 'iOS6' && preset !== 'iOS7' && preset !== 'iOS8' && leafName.startsWith('On ') && !leafName.endsWith(' Subtle');
                    let colorName = '';
                    if (finalValue && finalValue.includes('/')) {
                        const valParts = finalValue.replace(/[{}]/g, '').split('/');
                        colorName = valParts.length >= 2 ? valParts[valParts.length - 2] : valParts[0];
                    }
                    // iOS5: Positive+Negative → RiseFall, Buy+Sell → BuySell (matches parent-child path)
                    // iOS4: Negative+Sell → RiseFall, Positive+Buy → BuySell (legacy)
                    if ((preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') && !isPlainOnToken && (v.name.includes('Positive') || v.name.includes('Negative'))) {
                        if (dominantColors.Fall) colorName = dominantColors.Fall;
                        iosIndex = `RiseFall/Fall${colorName}/${safeModeName}`;
                    } else if ((preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') && !isPlainOnToken && (v.name.includes('Buy') || v.name.includes('Sell'))) {
                        if (dominantColors.Buy) colorName = dominantColors.Buy;
                        iosIndex = `BuySell/Buy${colorName}/${safeModeName}`;
                    } else if ((preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') && !isPlainOnToken && (v.name.includes('Yes') || v.name.includes('No'))) {
                        if (dominantColors.Yes) colorName = dominantColors.Yes;
                        iosIndex = `YesNo/Yes${colorName}/${safeModeName}`;
                    } else if (preset !== 'iOS5' && preset !== 'iOS6' && preset !== 'iOS7' && preset !== 'iOS8' && !isPlainOnToken && (v.name.includes('Negative') || v.name.includes('Sell'))) {
                        if (dominantColors.Fall) colorName = dominantColors.Fall;
                        iosIndex = `RiseFall/Fall${colorName}/${safeModeName}`;
                    } else if (preset !== 'iOS5' && preset !== 'iOS6' && preset !== 'iOS7' && preset !== 'iOS8' && !isPlainOnToken && (v.name.includes('Positive') || v.name.includes('Buy'))) {
                        if (dominantColors.Buy) colorName = dominantColors.Buy;
                        iosIndex = `BuySell/Buy${colorName}/${safeModeName}`;
                    } else {
                        iosIndex = `Common/${safeModeName}`;
                    }
                }

                // iOS7/iOS8: inject unique child suffix into bucket key second segment
                if ((preset === 'iOS7' || preset === 'iOS8') && activeChildPairs[col.id] && iosIndex && !iosIndex.startsWith('Common/')) {
                  const iosParts = iosIndex.split('/');
                  if (iosParts.length >= 2) {
                    iosParts[1] = iosParts[1] + activeChildPairs[col.id].uniqueSuffix;
                    iosIndex = iosParts.join('/');
                  }
                }

                hasSelected = true;
                let targetStorage;

                if ((preset === 'iOS2' || preset === 'iOS3' || preset === 'iOS4' || preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') && iosIndex) {
                    const root = (preset === 'iOS3' || preset === 'iOS4' || preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') ? colResult[col.name].$index : colResult[col.name];
                    if (!root[iosIndex]) root[iosIndex] = {};
                    targetStorage = root[iosIndex];
                } else {
                    targetStorage = modeData;
                }

                const parts = v.name.split('/');
                const varName = parts.pop().trim();

                // Primitives mode: strip common prefix folders (e.g. RATIO/ or White Label/SNB/)
                if (primitivesMode && primitivesStripDepth > 0) {
                    parts.splice(0, primitivesStripDepth);
                }

                // TRACK VARIABLE ID FOR RENAMING
                const varObj = {
                    "$id": v.id, 
                    "$type": v.type.toLowerCase(),
                    "$libraryName": currentFileName,
                    "$collectionName": col.name,
                    "$value": (preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') ? (preset === 'iOS8' && activeChildPairs[col.id] && ios8AliasPrefix ? shortenAlias(finalValue, 0, ios8AliasPrefix) : shortenAlias(finalValue, activeChildPairs[col.id] ? 3 : 2)) : finalValue
                };

                if (exposeUnderlying && rawValue && rawValue.type === 'VARIABLE_ALIAS') {
                    if (v.type === 'COLOR') {
                        const colorObj = v.resolvedValuesByMode ? v.resolvedValuesByMode[mode.modeId] : null;
                        if (colorObj) varObj["$underlyingValue"] = rgbToHex(colorObj);
                    } else if (v.type === 'FLOAT') {
                        const numVal = v.resolvedValuesByMode ? v.resolvedValuesByMode[mode.modeId] : null;
                        if (numVal !== null && numVal !== undefined) varObj["$underlyingValue"] = numVal;
                    }
                }

                if (preset === 'iOS3' || preset === 'iOS4' || preset === 'iOS5' || preset === 'iOS6' || preset === 'iOS7' || preset === 'iOS8') varObj["$mode"] = mode.name;
                if (preset !== 'iOS2' && preset !== 'iOS3' && preset !== 'iOS4' && preset !== 'iOS5' && preset !== 'iOS6' && preset !== 'iOS7' && preset !== 'iOS8' && iosIndex) varObj["$index"] = iosIndex;

                let current = targetStorage;
                if (parts.length > 0) {
                    const rootGroup = parts[0].trim();
                    const fullGroupPath = parts.map(p => p.trim()).join('/');
                    if (primitivesMode) {
                        if (!current[fullGroupPath]) current[fullGroupPath] = {};
                        current[fullGroupPath][varName] = varObj;
                    } else {
                        if (!current[rootGroup]) current[rootGroup] = {};
                        if (fullGroupPath === rootGroup) current[rootGroup][varName] = varObj;
                        else {
                            if (!current[rootGroup][fullGroupPath]) current[rootGroup][fullGroupPath] = {};
                            current[rootGroup][fullGroupPath][varName] = varObj;
                        }
                    }
                } else {
                    current[varName] = varObj;
                }
             }
          });
          
          if (preset !== 'iOS2' && preset !== 'iOS3' && Object.keys(modeData).length > 0) {
              if (primitivesMode) {
                  if (!colResult[col.name].Primitives) colResult[col.name].Primitives = {};
                  Object.assign(colResult[col.name].Primitives, modeData);
              } else {
                  colResult[col.name].modes[mode.name] = modeData;
              }
          }
        });
        
        if (hasSelected) results.push(colResult);
      }

      // Merge child collection $index buckets into parent's $index and remove child entry
      for (const [childId] of Object.entries(activeChildPairs)) {
        const childColName = collectionsData.find(c => c.id === childId)?.name;
        const parentColName = activeChildPairs[childId].parentCol.name;
        const parentIdx = results.findIndex(r => r[parentColName]);
        const childIdx  = results.findIndex(r => r[childColName]);
        if (parentIdx === -1 || childIdx === -1) continue;
        const parentIndex = results[parentIdx][parentColName].$index;
        const childIndex  = results[childIdx][childColName].$index;
        if (parentIndex && childIndex) {
          for (const [bucket, vars] of Object.entries(childIndex)) {
            // Skip Common — child collection's non-keyword tokens (Surface, Background, etc.)
            // either dedupe vs parent or aren't part of the merged output. Yes/No and other
            // semantic groups land in their own named buckets and merge through normally.
            if (bucket.startsWith('Common/')) continue;
            if (!parentIndex[bucket]) parentIndex[bucket] = {};
            Object.assign(parentIndex[bucket], vars);
          }
        }
        results.splice(childIdx, 1);
      }

      results.push({ $knownCollections: globalKnowledge });
      return results;
    }
    lucide.createIcons();
  </script>
</body>
